<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NASA APOD Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        #background {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        #background.loaded {
            opacity: 1;
        }

        #info-panel {
            position: fixed;
            bottom: 40px;
            left: 40px;
            max-width: 520px;
            padding: 24px 28px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease 1s, transform 1s ease 1s;
        }

        #info-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #info-panel.hidden {
            display: none;
        }

        #date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .nasa-badge {
            display: inline-block;
            margin-right: 10px;
            padding: 3px 8px;
            background: #fc3d21;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            vertical-align: middle;
            color: white;
        }

        #title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        #explanation {
            font-size: 13px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.82);
            display: -webkit-box;
            -webkit-line-clamp: 7;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #copyright {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 14px;
            font-style: italic;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 500px;
            padding: 20px 28px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="background"></div>
    <div id="loading">Chargement NASA APOD...</div>
    <div id="info-panel" class="hidden">
        <div id="date"><span class="nasa-badge">NASA APOD</span><span id="date-text"></span></div>
        <div id="title"></div>
        <div id="explanation"></div>
        <div id="copyright"></div>
    </div>
    <div id="error"></div>

    <script>
        // Configuration (modifiable via Wallpaper Engine settings)
        const config = {
            apikey: 'DEMO_KEY',
            showinfo: true,
            usehd: true,
            language: 'fr'
        };

        let currentDate = null;

        async function loadAPOD() {
            const bg = document.getElementById('background');
            const loading = document.getElementById('loading');
            const infoPanel = document.getElementById('info-panel');
            const errorEl = document.getElementById('error');

            try {
                const url = `https://api.nasa.gov/planetary/apod?api_key=${config.apikey}&thumbs=true`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Erreur API: ${response.status}`);
                }

                const data = await response.json();

                // Skip if same day already loaded
                if (currentDate === data.date && bg.classList.contains('loaded')) {
                    return;
                }
                currentDate = data.date;

                let imageUrl = null;

                if (data.media_type === 'image') {
                    imageUrl = (config.usehd && data.hdurl) ? data.hdurl : data.url;
                } else if (data.media_type === 'video' && data.thumbnail_url) {
                    imageUrl = data.thumbnail_url;
                } else {
                    throw new Error("L'APOD du jour est une vidéo sans miniature.");
                }

                // Preload image
                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = () => {
                    bg.style.backgroundImage = `url('${imageUrl}')`;
                    bg.classList.add('loaded');
                    loading.style.display = 'none';
                    errorEl.style.display = 'none';

                    document.getElementById('title').textContent = data.title || '';
                    document.getElementById('date-text').textContent = formatDate(data.date);
                    document.getElementById('explanation').textContent = data.explanation || '';

                    const copyrightEl = document.getElementById('copyright');
                    if (data.copyright) {
                        copyrightEl.textContent = `© ${data.copyright.trim()}`;
                        copyrightEl.style.display = 'block';
                    } else {
                        copyrightEl.style.display = 'none';
                    }

                    if (config.showinfo) {
                        infoPanel.classList.remove('hidden');
                        requestAnimationFrame(() => {
                            setTimeout(() => infoPanel.classList.add('visible'), 50);
                        });
                    }
                };

                img.onerror = () => {
                    loading.style.display = 'none';
                    errorEl.textContent = "Impossible de charger l'image APOD.";
                    errorEl.style.display = 'block';
                };

                img.src = imageUrl;

            } catch (err) {
                console.error(err);
                loading.style.display = 'none';
                errorEl.textContent = `Erreur : ${err.message}. Vérifiez votre clé API.`;
                errorEl.style.display = 'block';
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString(config.language === 'fr' ? 'fr-FR' : 'en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function updateInfoPanelVisibility() {
            const panel = document.getElementById('info-panel');
            if (config.showinfo) {
                panel.classList.remove('hidden');
                setTimeout(() => panel.classList.add('visible'), 50);
            } else {
                panel.classList.remove('visible');
                setTimeout(() => panel.classList.add('hidden'), 500);
            }
        }

        // Wallpaper Engine property listener
        window.wallpaperPropertyListener = {
            applyUserProperties: function(properties) {
                let reloadNeeded = false;

                if (properties.apikey) {
                    const newKey = properties.apikey.value || 'DEMO_KEY';
                    if (newKey !== config.apikey) {
                        config.apikey = newKey;
                        reloadNeeded = true;
                    }
                }
                if (properties.usehd !== undefined) {
                    if (properties.usehd.value !== config.usehd) {
                        config.usehd = properties.usehd.value;
                        reloadNeeded = true;
                    }
                }
                if (properties.showinfo !== undefined) {
                    config.showinfo = properties.showinfo.value;
                    updateInfoPanelVisibility();
                }
                if (properties.language !== undefined) {
                    config.language = properties.language.value;
                    if (currentDate) {
                        document.getElementById('date-text').textContent = formatDate(currentDate);
                    }
                }

                if (reloadNeeded) {
                    currentDate = null;
                    document.getElementById('background').classList.remove('loaded');
                    document.getElementById('loading').style.display = 'block';
                    loadAPOD();
                }
            }
        };

        // Initial load
        loadAPOD();

        // Check for a new APOD every hour
        setInterval(loadAPOD, 3600000);
    </script>
</body>
</html>
