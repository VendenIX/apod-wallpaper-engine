<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NASA APOD Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        #background {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        #background.loaded {
            opacity: 1;
        }

        #info-panel {
            --px: 0px;
            --py: 0px;
            --ps: 1;
            position: fixed;
            bottom: 40px;
            left: 40px;
            max-width: 520px;
            padding: 24px 28px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translate(var(--px), calc(var(--py) + 20px)) scale(var(--ps));
            transform-origin: bottom left;
            transition: opacity 1s ease 1s, transform 1s ease 1s;
        }

        #info-panel.visible {
            opacity: 1;
            transform: translate(var(--px), var(--py)) scale(var(--ps));
        }

        #info-panel.hidden {
            display: none;
        }

        #date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .nasa-badge {
            display: inline-block;
            margin-right: 10px;
            padding: 3px 8px;
            background: #fc3d21;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            vertical-align: middle;
            color: white;
        }

        #title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        #explanation {
            font-size: 13px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.82);
            display: -webkit-box;
            -webkit-line-clamp: 7;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #copyright {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 14px;
            font-style: italic;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 500px;
            padding: 20px 28px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            display: none;
        }

        #scale-badge {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            padding: 14px 24px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.95);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 2000;
        }

        #scale-badge.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div id="background"></div>
    <div id="loading">Loading NASA APOD...</div>
    <div id="info-panel" class="hidden">
        <div id="date"><span class="nasa-badge">NASA APOD</span><span id="date-text"></span></div>
        <div id="title"></div>
        <div id="explanation"></div>
        <div id="copyright"></div>
    </div>
    <div id="error"></div>
    <div id="scale-badge"></div>
    <div id="debug-panel" style="
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(20px);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-family: 'Courier New', monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.6;
        display: none;
        max-width: 340px;
        z-index: 1000;
    ">
        <div style="font-weight: bold; margin-bottom: 6px; color: #4ade80;">🔧 DEBUG</div>
        <div>API key: <span id="debug-key">—</span></div>
        <div>Last call: <span id="debug-lastcall">—</span></div>
        <div>Last status: <span id="debug-status">—</span></div>
        <div>Last APOD: <span id="debug-apod">—</span></div>
        <div>Cache: <span id="debug-cache">—</span></div>
        <div>Reloads: <span id="debug-reloads">0</span></div>
    </div>

    <script>
        // Configuration (modifiable via Wallpaper Engine settings)
        const config = {
            apikey: '',   // optional — falls back to DEMO_KEY (shared, rate-limited)
            showinfo: true,
            usehd: true,
            language: 'fr',
            panelOffsetX: 0,
            panelOffsetY: 0,
            panelScale: 1,
            debug: false
        };

        // New official endpoint (the legacy api.nasa.gov/planetary/apod is shut down on 2026-12-01)
        const APOD_ENDPOINT = 'https://science.nasa.gov/wp-json/wp/v2/apod-basic/';
        const CACHE_KEY = 'apod_cache_v2';          // v2: drops caches poisoned by the broken legacy API
        const LEGACY_CACHE_KEYS = ['apod_cache_v1'];
        const RETRY_DELAY_MS = 5 * 60 * 1000;
        const REFRESH_INTERVAL_MS = 60 * 60 * 1000;
        const PANEL_SCALES = [1, 1.25, 1.5, 1.75];

        let currentDate = null;
        let reloadCount = 0;
        let scaleBadgeTimeout = null;
        let retryTimeout = null;

        // State shown in the debug overlay (kept even while the overlay is off)
        const debugState = {
            lastCall: null,
            lastStatus: null,
            lastApod: null
        };

        function applyPanelTransform() {
            const panel = document.getElementById('info-panel');
            panel.style.setProperty('--px', `${config.panelOffsetX}px`);
            // CSS Y axis is inverted vs. user intuition (+ = down), so we negate
            // to make the slider's "positive = up" labeling hold.
            panel.style.setProperty('--py', `${-config.panelOffsetY}px`);
            panel.style.setProperty('--ps', config.panelScale);
        }

        function showScaleBadge(scale) {
            const badge = document.getElementById('scale-badge');
            badge.textContent = `×${scale}`;
            badge.classList.add('visible');
            clearTimeout(scaleBadgeTimeout);
            scaleBadgeTimeout = setTimeout(() => badge.classList.remove('visible'), 700);
        }

        function setupWheelZoom() {
            const panel = document.getElementById('info-panel');
            panel.addEventListener('wheel', (e) => {
                e.preventDefault();
                let idx = PANEL_SCALES.indexOf(config.panelScale);
                if (idx === -1) idx = 0;
                if (e.deltaY < 0) idx = Math.min(idx + 1, PANEL_SCALES.length - 1);
                else idx = Math.max(idx - 1, 0);
                if (PANEL_SCALES[idx] === config.panelScale) return;
                config.panelScale = PANEL_SCALES[idx];
                applyPanelTransform();
                showScaleBadge(config.panelScale);
            }, { passive: false });
        }

        function maskKey(key) {
            if (!key) return '(empty → DEMO_KEY)';
            if (key.length < 8) return key;
            return key.substring(0, 4) + '•••••••' + key.substring(key.length - 4);
        }

        function effectiveKey() {
            const key = (config.apikey || '').trim();
            return key || 'DEMO_KEY';
        }

        function setDebug(patch) {
            Object.assign(debugState, patch);
            renderDebugPanel();
        }

        function renderDebugPanel() {
            const panel = document.getElementById('debug-panel');
            panel.style.display = config.debug ? 'block' : 'none';
            if (!config.debug) return;
            document.getElementById('debug-key').textContent = maskKey(config.apikey);
            document.getElementById('debug-lastcall').textContent =
                debugState.lastCall ? debugState.lastCall.toLocaleTimeString() : '—';
            document.getElementById('debug-status').textContent = debugState.lastStatus ?? '—';
            document.getElementById('debug-apod').textContent = debugState.lastApod ?? '—';
            document.getElementById('debug-reloads').textContent = reloadCount;

            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (raw) {
                    const c = JSON.parse(raw);
                    const sizeKB = Math.round(raw.length / 1024);
                    document.getElementById('debug-cache').textContent = `${c.date} (${sizeKB} KB)`;
                } else {
                    document.getElementById('debug-cache').textContent = 'empty';
                }
            } catch {
                document.getElementById('debug-cache').textContent = 'error';
            }
        }

        function getErrorMessage(status) {
            switch (status) {
                case 401:
                case 403:
                    return "Invalid API key. Check your key in the wallpaper settings.";
                case 429:
                    return "Rate limit reached. Use your own NASA API key (not DEMO_KEY).";
                case 500:
                case 502:
                case 503:
                case 504:
                    return `NASA server temporarily unavailable (${status}). Retrying in a few minutes...`;
                default:
                    return `NASA API error (${status}). Will retry on next refresh.`;
            }
        }

        function scheduleRetry(delayMs) {
            clearTimeout(retryTimeout);
            retryTimeout = setTimeout(loadAPOD, delayMs);
        }

        // --- Text helpers: the new API returns HTML in explanation / credit ---
        function htmlToText(html) {
            if (!html) return '';
            const doc = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html');
            return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function cleanExplanation(html) {
            if (!html) return '';
            // Drop the editorial footer ("APOD's email…", "Tomorrow's picture…") after the first double <br>
            const main = html.split(/<br\s*\/?>\s*<br\s*\/?>/i)[0];
            return htmlToText(main).replace(/^Explanation:\s*/i, '');
        }

        // Pick the image URL to display. hdurl is a resizable "dynamicimage" URL:
        // keep it as-is for HD, or ask the CDN for a 1920px-wide version otherwise.
        function pickImageUrl(hdurl) {
            if (!hdurl) return null;
            if (config.usehd) return hdurl;
            try {
                const u = new URL(hdurl);
                if (u.pathname.includes('/dynamicimage/')) {
                    u.search = '?w=1920&fit=clip';
                    return u.toString();
                }
            } catch { /* fall through */ }
            return hdurl;
        }

        // Convert one API entry into the shape the wallpaper uses, or explain why it's unusable
        function normalizeEntry(raw) {
            const entry = Array.isArray(raw) ? raw[0] : raw;
            if (!entry || typeof entry !== 'object') {
                return { error: 'Empty or unexpected API response.' };
            }
            if (entry.code && entry.message) {
                return { error: `NASA API error: ${entry.message}` };
            }
            const title = htmlToText(entry.title);
            const hdurl = entry.hdurl || '';
            if (!entry.date || !title) {
                return { error: 'API response is missing date or title.' };
            }
            // Guard against placeholder data like the broken legacy API (NASA logo / "NASA Science")
            if (/nasa-logo/i.test(hdurl) || title === 'NASA Science') {
                return { error: 'API returned placeholder data (NASA logo), ignoring it.' };
            }
            // Videos (YouTube/Vimeo…) can't be a wallpaper, and the new API no longer offers thumbnails
            const mediaType = (entry.media_type || 'image').toLowerCase();
            if (mediaType !== 'image' || !hdurl) {
                return { error: `APOD ${entry.date} is a ${mediaType} with no usable image — keeping the current one.` };
            }
            const credit = htmlToText(entry.copyright || entry.credit || '');
            return {
                data: {
                    date: entry.date,
                    title,
                    explanation: cleanExplanation(entry.explanation),
                    copyright: credit || null,
                    media_type: entry.media_type || 'image',
                    permalink: entry.permalink || entry.url || null
                },
                imageUrl: pickImageUrl(hdurl)
            };
        }

        function showErrorIfNothingDisplayed(message) {
            const bg = document.getElementById('background');
            if (bg.classList.contains('loaded')) return; // keep the current image, stay silent
            document.getElementById('loading').style.display = 'none';
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        async function loadAPOD() {
            const hasImageLoaded = document.getElementById('background').classList.contains('loaded');
            const url = `${APOD_ENDPOINT}?api_key=${encodeURIComponent(effectiveKey())}`;
            console.log('[APOD] Fetching:', url.replace(effectiveKey(), maskKey(config.apikey)));
            setDebug({ lastCall: new Date(), lastStatus: 'pending…' });

            try {
                const response = await fetch(url, { cache: 'no-store' });
                console.log('[APOD] Response status:', response.status);
                setDebug({ lastStatus: response.status });

                if (!response.ok) {
                    const message = getErrorMessage(response.status);
                    if ([500, 502, 503, 504, 429].includes(response.status)) {
                        console.log('[APOD] Transient error, keeping current image and retrying in 5min.');
                        showErrorIfNothingDisplayed(message);
                        scheduleRetry(RETRY_DELAY_MS);
                        return;
                    }
                    throw new Error(message);
                }

                const { data, imageUrl, error } = normalizeEntry(await response.json());
                if (error) {
                    console.warn('[APOD]', error);
                    setDebug({ lastStatus: `${response.status} (rejected)` });
                    showErrorIfNothingDisplayed(error);
                    return; // next hourly check will try again
                }
                setDebug({ lastApod: `${data.date} — ${data.title}` });

                if (currentDate === data.date && hasImageLoaded) {
                    console.log('[APOD] Already displaying', data.date, '— skipping.');
                    return;
                }

                // Preload before switching so the screen never goes blank.
                // No crossOrigin attribute: displaying the image doesn't need CORS.
                const img = new Image();
                img.onload = () => {
                    console.log('[APOD] New image loaded, applying:', data.title);
                    displayAPOD(data, imageUrl);
                    currentDate = data.date;
                    saveToCache(data, imageUrl).catch(err =>
                        console.warn('[APOD] Cache save failed:', err.message)
                    );
                };
                img.onerror = () => {
                    console.warn('[APOD] Image failed to load, keeping current display:', imageUrl);
                    showErrorIfNothingDisplayed('Failed to load the APOD image.');
                    scheduleRetry(RETRY_DELAY_MS);
                };
                img.src = imageUrl;

            } catch (err) {
                // A TypeError here usually means a network/CORS failure (no HTTP status available)
                console.error('[APOD]', err);
                setDebug({ lastStatus: err instanceof TypeError ? 'network/CORS error' : 'error' });
                showErrorIfNothingDisplayed(err.message);
                scheduleRetry(RETRY_DELAY_MS);
            }
        }

        // Display APOD data + image (used by both fresh fetch and cache restore)
        function displayAPOD(data, imageUrl) {
            const bg = document.getElementById('background');
            const infoPanel = document.getElementById('info-panel');

            bg.style.backgroundImage = `url("${imageUrl.replace(/"/g, '%22')}")`;
            bg.classList.add('loaded');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            document.getElementById('title').textContent = data.title || '';
            document.getElementById('date-text').textContent = formatDate(data.date);
            document.getElementById('explanation').textContent = data.explanation || '';

            const copyrightEl = document.getElementById('copyright');
            if (data.copyright) {
                copyrightEl.textContent = `© ${data.copyright.trim()}`;
                copyrightEl.style.display = 'block';
            } else {
                copyrightEl.style.display = 'none';
            }

            if (config.showinfo) {
                infoPanel.classList.remove('hidden');
                requestAnimationFrame(() => {
                    setTimeout(() => infoPanel.classList.add('visible'), 50);
                });
            }
        }

        // --- Cache system using localStorage ---
        // Tries to store the image itself (base64) so it survives offline; if the CDN
        // refuses cross-origin reads or the image is too big, stores metadata + URL only.
        async function saveToCache(data, imageUrl) {
            const base = { ...data, cachedAt: Date.now() };
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
                localStorage.setItem(CACHE_KEY, JSON.stringify({ ...base, imageDataUrl: dataUrl }));
                console.log('[APOD] Cache saved (', Math.round(dataUrl.length / 1024), 'KB)');
            } catch (err) {
                console.warn('[APOD] Full cache failed, saving metadata only:', err.message);
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({ ...base, imageUrl }));
                } catch (e) {
                    console.error('[APOD] Could not save any cache:', e.message);
                }
            }
            renderDebugPanel();
        }

        function loadFromCache() {
            try {
                LEGACY_CACHE_KEYS.forEach(k => localStorage.removeItem(k));
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) {
                    console.log('[APOD] No cache found.');
                    return false;
                }
                const cache = JSON.parse(raw);
                const image = cache.imageDataUrl || cache.imageUrl;
                if (!image || cache.title === 'NASA Science' || /nasa-logo/i.test(cache.imageUrl || '')) {
                    localStorage.removeItem(CACHE_KEY);
                    return false;
                }
                console.log('[APOD] Restoring from cache, date:', cache.date);
                displayAPOD(cache, image);
                currentDate = cache.date;
                return true;
            } catch (err) {
                console.warn('[APOD] Could not load cache:', err.message);
                return false;
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            if (isNaN(date)) return dateStr || '';
            return date.toLocaleDateString(config.language === 'fr' ? 'fr-FR' : 'en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function updateInfoPanelVisibility() {
            const panel = document.getElementById('info-panel');
            if (config.showinfo) {
                panel.classList.remove('hidden');
                setTimeout(() => panel.classList.add('visible'), 50);
            } else {
                panel.classList.remove('visible');
                setTimeout(() => panel.classList.add('hidden'), 500);
            }
        }

        // Wallpaper Engine property listener
        window.wallpaperPropertyListener = {
            applyUserProperties: function(properties) {
                console.log('[APOD] applyUserProperties called with:', Object.keys(properties));
                let reloadNeeded = false;

                if (properties.apikey) {
                    const newKey = (properties.apikey.value || '').trim();
                    if (newKey !== config.apikey) {
                        console.log('[APOD] API key changed:', maskKey(config.apikey), '→', maskKey(newKey));
                        config.apikey = newKey;
                        reloadNeeded = true;
                    }
                }
                if (properties.usehd !== undefined) {
                    if (properties.usehd.value !== config.usehd) {
                        config.usehd = properties.usehd.value;
                        reloadNeeded = true;
                    }
                }
                if (properties.showinfo !== undefined) {
                    config.showinfo = properties.showinfo.value;
                    updateInfoPanelVisibility();
                }
                if (properties.language !== undefined) {
                    config.language = properties.language.value;
                    if (currentDate) {
                        document.getElementById('date-text').textContent = formatDate(currentDate);
                    }
                }
                if (properties.panelOffsetX !== undefined) {
                    config.panelOffsetX = Number(properties.panelOffsetX.value) || 0;
                    applyPanelTransform();
                }
                if (properties.panelOffsetY !== undefined) {
                    config.panelOffsetY = Number(properties.panelOffsetY.value) || 0;
                    applyPanelTransform();
                }
                if (properties.panelScale !== undefined) {
                    const parsed = parseFloat(properties.panelScale.value);
                    config.panelScale = PANEL_SCALES.includes(parsed) ? parsed : 1;
                    applyPanelTransform();
                }
                if (properties.debug !== undefined) {
                    config.debug = properties.debug.value;
                    renderDebugPanel();
                }

                if (reloadNeeded) {
                    reloadCount++;
                    console.log('[APOD] Config changed, re-fetching silently. Total reloads:', reloadCount);
                    // Keep the current image; a successful fetch replaces it, a failure leaves it.
                    currentDate = null;
                    document.getElementById('error').style.display = 'none';
                    loadAPOD();
                }
            }
        };

        // Initial load: show cache instantly, then fetch.
        // The first fetch waits briefly so Wallpaper Engine can deliver the user's API key
        // first (otherwise the very first call would always go out with DEMO_KEY).
        console.log('[APOD] Wallpaper initialized.');
        applyPanelTransform();
        setupWheelZoom();
        loadFromCache();
        setTimeout(() => { if (reloadCount === 0) loadAPOD(); }, 1500);

        // Check for a new APOD every hour
        setInterval(loadAPOD, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
